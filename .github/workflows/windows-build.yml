name: Build AVI Knowledge Hub Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AVI_Knowledge_Hub source/avi_hub.py
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/Database | Out-Null
          Copy-Item dist/AVI_Knowledge_Hub.exe release/
          Copy-Item Database/AVI_Database.csv release/Database/AVI_Database_TEMPLATE.csv
          Compress-Archive -Path release/* -DestinationPath AVI_Knowledge_Hub_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AVI_Knowledge_Hub_Windows
          path: AVI_Knowledge_Hub_Windows.zip
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AVI_Knowledge_Hub_Windows.zip
