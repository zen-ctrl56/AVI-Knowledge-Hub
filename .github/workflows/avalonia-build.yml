name: Build ZENTREK Avalonia V4.2.5
on:
  workflow_dispatch:
  push:
    paths:
      - 'avalonia/**'
      - '.github/workflows/avalonia-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore avalonia/Zentrek.csproj
      - name: Build Windows application
        run: dotnet build avalonia/Zentrek.csproj -c Release --no-restore
      - name: Publish self-contained Windows EXE
        run: dotnet publish avalonia/Zentrek.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o release
      - name: Package app and empty database template
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/Database | Out-Null
          Set-Content -Path release/Database/AVI_Database_TEMPLATE.csv -Value 'id,title,category,machine,symptoms,solution'
          Compress-Archive -Path release/* -DestinationPath ZENTREK_Avalonia_V4.2.5_Windows_x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ZENTREK_Avalonia_V4.2.5_Windows_x64
          path: ZENTREK_Avalonia_V4.2.5_Windows_x64.zip
      - name: Publish V4.2.5 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v4.2.5'
          if (gh release view $tag --json tagName 2>$null) {
            gh release upload $tag ZENTREK_Avalonia_V4.2.5_Windows_x64.zip --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag ZENTREK_Avalonia_V4.2.5_Windows_x64.zip --target $env:GITHUB_SHA --title "ZENTREK V4.2.5 - Avalonia Desktop Preview" --notes "Native Windows x64 self-contained .NET 8/Avalonia EXE. First migration preview: dashboard, read-only machine registry, CSV knowledge search, symptom search and 2026 shift calendar. The full floor planner, editor, diagnostic wizard and heartbeat monitoring are NOT migrated. Extract ZIP and place approved Database/AVI_Database.csv alongside EXE. Do not deploy to production until tested and approved by site IT." --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
